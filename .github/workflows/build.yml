name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать обновление, если загружен AvroraMap.zip
        run: |
          if [ -f AvroraMap.zip ]; then
            unzip -oq AvroraMap.zip -d /tmp/p
            rm -rf /tmp/p/AvroraMap/.github app
            cp -r /tmp/p/AvroraMap/. .
            git rm -q AvroraMap.zip
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git commit -m "Обновление проекта из zip"
            git push
          fi

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/avrora.jks
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан временным ключом"
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-grad
