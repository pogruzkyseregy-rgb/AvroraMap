name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          if [ -f AvroraMap.zip ]; then
            unzip -oq AvroraMap.zip -d /tmp/p
            rm -rf /tmp/p/AvroraMap/.github app
            cp -r /tmp/p/AvroraMap/. .
            git rm -q AvroraMap.zip
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add -A
            git commit -m "Update from zip"
            git push
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: AvroraMap-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
